name: Mirror to GitLab

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository to GitLab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          REPO: alpha-1-design/Gia-co-Design
        run: |
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/alpha-1-design/Gia-co-Design-.git" mirror.git
          cd mirror.git
          git push --mirror "https://oauth2:${GL_TOKEN}@gitlab.com/${REPO}.git"
